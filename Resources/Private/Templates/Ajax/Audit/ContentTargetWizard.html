<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers">

    <f:format.htmlentitiesDecode><style>{inlineStyles}</style></f:format.htmlentitiesDecode>

    <div class="panel panel-default wizard-slide" id="auditContentTargetWizard">
        <div class="panel-heading">
            <h3 class="panel-title fw-bold">
                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.header" />
            </h3>
        </div>
        <div class="panel-body">
            <div class="form-group mb-3">
                <label class="form-label fw-bold" for="targetCType">
                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.ctype" />
                </label>
                <select class="form-select" id="targetCType">
                    <optgroup label="{f:translate(key: 'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.recommended')}">
                        <f:for each="{ceOptions}" as="option">
                            <f:if condition="{option.recommended}">
                                <option value="{option.value}">{option.label}<f:if condition="{option.faqCapable}"> (FAQ)</f:if></option>
                            </f:if>
                        </f:for>
                    </optgroup>
                    <optgroup label="{f:translate(key: 'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.others')}">
                        <f:for each="{ceOptions}" as="option">
                            <f:if condition="{option.recommended}">
                                <f:else>
                                    <option value="{option.value}">{option.label}</option>
                                </f:else>
                            </f:if>
                        </f:for>
                    </optgroup>
                </select>
            </div>
            <div class="form-group mb-3">
                <label class="form-label fw-bold" for="targetColumn">
                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.column" />
                </label>
                <select class="form-select" id="targetColumn">
                    <f:for each="{columns}" as="label" key="colPos">
                        <option value="{colPos}">{label}</option>
                    </f:for>
                </select>
            </div>
            <div class="form-group mb-3">
                <label class="form-label fw-bold" for="targetPosition">
                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.position" />
                </label>
                <select class="form-select" id="targetPosition">
                    <option value="top" data-colpos="*">
                        <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.position.top" />
                    </option>
                    <f:for each="{elementsByColumn}" as="elements" key="colPos">
                        <f:for each="{elements}" as="element">
                            <option value="{element.uid}" data-colpos="{colPos}">
                                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.position.after" />
                                {element.label}
                            </option>
                        </f:for>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-primary" id="aiSuiteTargetContinueBtn">
                    <core:icon identifier="actions-rocket" size="small" />
                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.target.continue" />
                </button>
            </div>
        </div>
    </div>
</html>
