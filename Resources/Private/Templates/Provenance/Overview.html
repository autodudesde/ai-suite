<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
{namespace core=TYPO3\CMS\Core\ViewHelpers}

<f:layout name="Module" />

<f:section name="Content">
    <div class="row">
        <div class="col-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <label class="panel-title fw-bold">
                        <core:icon identifier="actions-list-alternative" />
                        <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.title"/>
                    </label>
                </div>
                <div class="panel-body">
                    <f:if condition="{denied}">
                        <f:then>
                            <f:render partial="Libs/Notification" arguments="{
                                type: 'warning',
                                iconIdentifier: 'actions-exclamation-triangle',
                                iconSize: 'small',
                                titleKey: 'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.noAccess.title',
                                messageKey: 'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.noAccess.message'
                            }" />
                        </f:then>
                        <f:else>
                            <p><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.intro"/></p>

                            <f:render partial="Provenance/AreaTabs" arguments="{tabs: tabs}" />
                            <f:render partial="Provenance/FilterRow" arguments="{_all}" />

                            <f:if condition="{orphanCount} > 0">
                                <form action="{cleanupUri}" method="post" class="mb-3">
                                    <input type="hidden" name="area" value="{area}" />
                                    <f:render partial="Provenance/OtherFilters" arguments="{otherFilters: otherFilters}" />
                                    <button type="submit" class="btn btn-default btn-sm">
                                        <core:icon identifier="actions-delete" size="small" />
                                        <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.cleanup" arguments="{0: orphanCount}"/>
                                    </button>
                                </form>
                            </f:if>

                            <f:if condition="{groups}">
                                <f:then>
                                    <form action="{reviewUri}" method="post" data-provenance-review-form="1">
                                        <input type="hidden" name="area" value="{area}" />
                                        <input type="hidden" name="filters[{area}][mode]" value="{filter.mode}" />
                                        <input type="hidden" name="filters[{area}][feature]" value="{filter.feature}" />
                                        <input type="hidden" name="filters[{area}][tablename]" value="{filter.tablename}" />
                                        <input type="hidden" name="filters[{area}][reviewed]" value="{filter.reviewed}" />
                                        <input type="hidden" name="filters[{area}][page]" value="{filter.page}" />
                                        <f:render partial="Provenance/OtherFilters" arguments="{otherFilters: otherFilters}" />

                                        <div class="form-check form-check-type-toggle mb-3">
                                            <input class="form-check-input" type="checkbox" id="provenanceToggleAll" data-provenance-toggle-all="1" value="1" />
                                            <label class="form-check-label fw-bold" for="provenanceToggleAll">
                                                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.selectAll"/>
                                            </label>
                                        </div>

                                        <f:for each="{groups}" as="group" iteration="groupIteration">
                                            <div class="panel panel-default">
                                                <div class="panel-heading">
                                                    <button class="panel-button provenance-group-toggle d-flex align-items-center gap-2 w-100 text-start" type="button" data-bs-toggle="collapse" data-bs-target="#provenanceGroup{groupIteration.index}" aria-expanded="true">
                                                        <span class="provenance-chevron"><core:icon identifier="actions-chevron-down" size="small" /></span>
                                                        <core:icon identifier="{group.header.icon}" size="small" />
                                                        <f:if condition="{group.header.link}">
                                                            <f:then><a href="{group.header.link}">{group.header.title}</a></f:then>
                                                            <f:else>{group.header.title}</f:else>
                                                        </f:if>
                                                        <span class="badge badge-default ms-2">{group.count}</span>
                                                    </button>
                                                </div>
                                                <div class="panel-collapse collapse show" id="provenanceGroup{groupIteration.index}">
                                                    <div class="table-fit">
                                                        <table class="table table-striped recordlist mb-0">
                                                            <thead class="thead-dark">
                                                                <tr>
                                                                    <th class="col-checkbox"></th>
                                                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.record"/></th>
                                                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.mode"/></th>
                                                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.feature"/></th>
                                                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.written"/></th>
                                                                    <f:if condition="{area} != 'records'">
                                                                        <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.context.{area}"/></th>
                                                                    </f:if>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <f:for each="{group.entries}" as="entry">
                                                                    <f:render partial="Provenance/Row" arguments="{record: entry.record, nested: 0, area: area, dateFormat: dateFormat}" />
                                                                    <f:for each="{entry.children}" as="child">
                                                                        <f:render partial="Provenance/Row" arguments="{record: child, nested: 1, area: area, dateFormat: dateFormat}" />
                                                                    </f:for>
                                                                </f:for>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        </f:for>

                                        <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between">
                                            <button type="submit" class="btn btn-default btn-sm">
                                                <core:icon identifier="actions-check" size="small" />
                                                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.markSelected"/>
                                            </button>
                                            <f:render partial="Provenance/Pagination" arguments="{pagination: pagination}" />
                                        </div>
                                    </form>
                                </f:then>
                                <f:else>
                                    <f:render partial="Libs/Notification" arguments="{
                                        type: 'info',
                                        iconIdentifier: 'actions-info',
                                        iconSize: 'small',
                                        titleKey: '',
                                        messageKey: '{f:if(condition: registerIsEmpty, then: \'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.empty\', else: \'LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.emptyArea\')}'
                                    }" />
                                </f:else>
                            </f:if>
                        </f:else>
                    </f:if>
                </div>
            </div>
        </div>
    </div>
</f:section>
</html>
