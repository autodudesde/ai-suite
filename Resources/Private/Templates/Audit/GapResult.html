<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
      {namespace core=TYPO3\CMS\Core\ViewHelpers}
      {namespace be=TYPO3\CMS\Backend\ViewHelpers}

<f:layout name="Module"/>

<f:section name="Content">

    <div class="row">
        <div class="col-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <label class="panel-title fw-bold">
                        <core:icon identifier="actions-search" />
                        <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.result.headline"/>
                        ({auditTypeLabel}) — {url}
                    </label>
                </div>
                <div class="panel-body">

                    <f:if condition="{cachedAt}">
                        <div class="alert alert-info">
                            <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.cachedHint"/>
                            <f:format.date format="d.m.Y H:i">@{cachedAt}</f:format.date>
                        </div>
                    </f:if>

                    <f:if condition="{target}">
                        <p class="text-body-secondary">
                            <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.source"/>:
                            {target}
                        </p>
                    </f:if>

                    <f:if condition="{noCandidates}">
                        <f:if condition="{domainUnknown}">
                            <f:then>
                                <div class="alert alert-warning">
                                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.noDomainData"/>
                                </div>
                            </f:then>
                            <f:else if="{pageNotRanking}">
                                <div class="alert alert-info">
                                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.pageNotRanking"/>
                                </div>
                            </f:else>
                            <f:else>
                                <div class="alert alert-success">
                                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.noCandidates"/>
                                </div>
                            </f:else>
                        </f:if>
                    </f:if>

                    <f:if condition="{gaps}">
                        <p>
                            <span class="badge badge-danger">{summary.open} <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.open"/></span>
                            <span class="badge badge-warning">{summary.partial} <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.partial"/></span>
                            <span class="badge badge-success">{summary.answered} <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.answered"/></span>
                        </p>

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th class="col-sm-1"></th>
                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.query"/></th>
                                    <th class="text-end"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.candidates.volume"/></th>
                                    <th class="text-end"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.difficulty"/></th>
                                    <th class="text-end"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.position"/></th>
                                    <th><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.note"/></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{gaps}" as="gap">
                                    <tr>
                                        <td>
                                            <f:switch expression="{gap.status}">
                                                <f:case value="answered"><span class="badge badge-success"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.answered"/></span></f:case>
                                                <f:case value="partial"><span class="badge badge-warning"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.partial"/></span></f:case>
                                                <f:defaultCase><span class="badge badge-danger"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.questions.open"/></span></f:defaultCase>
                                            </f:switch>
                                        </td>
                                        <td><strong>{gap.keyword}</strong></td>
                                        <td class="text-end">
                                            <f:if condition="{gap.searchVolume}">
                                                <f:then>{gap.searchVolume}</f:then>
                                                <f:else>—</f:else>
                                            </f:if>
                                        </td>
                                        <td class="text-end">{gap.difficultyDisplay}</td>
                                        <td class="text-end">{gap.position}</td>
                                        <td class="text-body-secondary">{gap.note}</td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </f:if>

                    <f:if condition="{generatePrompt}">
                        <div class="callout callout-info">
                            <div class="callout-body">
                                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.generateHint"/>
                                <br/>
                                <button type="button" class="btn btn-primary btn-sm mt-2 audit-generate-btn"
                                        data-page-id="{pageId}" data-audit-type="gap" data-action="section" data-prompt="{generatePrompt}">
                                    <core:icon identifier="actions-rocket" size="small"/>
                                    <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.gap.generate"/>
                                </button>
                            </div>
                        </div>
                    </f:if>

                    <a class="btn btn-default" href="{f:be.uri(route: 'ai_suite_audit')}">
                        <core:icon identifier="actions-arrow-left" size="small"/>
                        <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.module.audit.result.newAudit"/>
                    </a>

                </div>
            </div>
        </div>
    </div>

</f:section>
</html>
