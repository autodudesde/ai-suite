<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
{namespace core=TYPO3\CMS\Core\ViewHelpers}

<tr>
    <td class="col-checkbox">
        <f:if condition="{record.exists}">
            <!-- The wrapper is what gives the box its size: the backend styles the input through it. -->
            <div class="form-check form-check-type-toggle">
                <input class="form-check-input" type="checkbox" name="records[]" value="{record.table}:{record.uid}" />
            </div>
        </f:if>
    </td>
    <td>
        <f:if condition="{nested}"><span class="text-muted me-1">&#9492;</span></f:if>
        <f:if condition="{record.exists}">
            <f:then><a href="{record.editLink}" title="{record.table}:{record.uid}">{record.title}</a></f:then>
            <f:else><span class="text-muted"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.recordGone"/></span></f:else>
        </f:if>
    </td>
    <td class="col-nowrap">
        <span class="badge badge-info" title="{record.description}">
            <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.badge.{record.mode}" default="{record.mode}"/>
        </span>
        <f:if condition="{record.reviewedAt} > 0">
            <span class="badge badge-success"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.reviewed"/></span>
        </f:if>
        <f:if condition="{record.edited}">
            <span class="badge badge-default"><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.editedSince"/></span>
        </f:if>
    </td>
    <td><f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.feature.{record.feature}" default="{record.feature}"/></td>
    <td class="col-nowrap"><f:format.date format="{dateFormat}">@{record.crdate}</f:format.date></td>
    <f:if condition="{area} != 'records'">
        <td>
            <f:if condition="{record.context.link}">
                <f:then><a href="{record.context.link}">{record.context.title}</a></f:then>
                <f:else><span class="text-muted">{record.context.title}</span></f:else>
            </f:if>
        </td>
    </f:if>
</tr>
</html>
