<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<ul class="nav nav-tabs mb-3" role="tablist">
    <f:for each="{tabs}" as="tab">
        <li class="nav-item" role="presentation">
            <a class="nav-link{f:if(condition: tab.active, then: ' active')}" href="{tab.link}">
                <f:translate key="LLL:EXT:ai_suite/Resources/Private/Language/locallang_module.xlf:aiSuite.provenance.overview.area.{tab.area}"/>
                <span class="badge badge-default ms-2">{tab.count}</span>
            </a>
        </li>
    </f:for>
</ul>
</html>
